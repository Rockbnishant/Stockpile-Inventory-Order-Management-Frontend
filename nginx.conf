server {
    listen       ${PORT} default_server;
    listen       [::]:${PORT} default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- security headers ---
    add_header X-Frame-Options           "SAMEORIGIN"        always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # --- gzip ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml application/xml+rss image/svg+xml
        font/ttf font/otf application/font-woff application/font-woff2;

    # Lightweight liveness probe (used by Docker HEALTHCHECK / Railway).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Cache hashed Vite assets aggressively.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't serve dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
